{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="auth-card">
            <h3 class="fw-bold text-center mb-3">Créer un compte</h3>
            <p class="text-muted text-center mb-4">Rejoignez la communauté Crochet Bags.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-dark w-100 mt-3">Créer compte</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
