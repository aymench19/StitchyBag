{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="checkout-card">
            <h2 class="fw-bold mb-2">Validation de commande</h2>
            <p class="text-muted">Renseignez vos coordonnées pour finaliser votre commande.</p>

            <form method="post" class="mt-4">
                {% csrf_token %}

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Prénom</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom</label>
                        {{ form.last_name }}
                    </div>
                    <div class="col-12">
                        <label class="form-label">Téléphone</label>
                        {{ form.phone }}
                    </div>
                    <div class="col-12">
                        <label class="form-label">Ville</label>
                        {{ form.city }}
                    </div>
                    <div class="col-12">
                        <label class="form-label">Adresse</label>
                        {{ form.address }}
                    </div>
                </div>

                <button type="submit" class="btn btn-dark btn-lg w-100 mt-4">Confirmer la commande</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
