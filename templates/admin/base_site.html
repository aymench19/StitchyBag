{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | StitchyBag Administration{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}

{% block branding %}
<h1 id="site-name" class="admin-branding-title">
    <a href="{% url 'admin:index' %}">
        <img src="{% static 'images/logo.png' %}" alt="StitchyBag" class="admin-brand-logo">
        <span>StitchyBag</span>
    </a>
</h1>
<div id="admin-quick-links">
    <a href="/" class="admin-quick-link">Voir le site</a>
</div>
{% endblock %}
